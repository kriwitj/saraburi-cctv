services:
  db:
    image: postgis/postgis:15-3.3
    container_name: srb-cctv-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srb_secure_password_2569}
      POSTGRES_DB: ${POSTGRES_DB:-srb_cctv_registry}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - cctv-net

  media:
    image: alexxit/go2rtc:latest
    container_name: srb-cctv-media
    restart: always
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:1984:1984" # API / Web UI
      - "8554:8554" # RTSP Server (โปรโตคอลตรง ต้องเปิดออกเสมอ ไม่ผ่าน Traefik)
      - "8555:8555/tcp" # WebRTC TCP (โปรโตคอลตรง ต้องเปิดออกเสมอ ไม่ผ่าน Traefik)
      - "8555:8555/udp" # WebRTC UDP (โปรโตคอลตรง ต้องเปิดออกเสมอ ไม่ผ่าน Traefik)
    volumes:
      - ./media-config/go2rtc.yaml:/config/go2rtc.yaml
    networks:
      - cctv-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: srb-cctv-backend
    restart: always
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-srb_admin}:${POSTGRES_PASSWORD:-srb_secure_password_2569}@db:5432/${POSTGRES_DB:-srb_cctv_registry}
      - MEDIA_SERVER_API=http://media:1984
      - JWT_SECRET=${JWT_SECRET:-srb_jwt_secret_key_2026_super_secure}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      - db
      - media
    networks:
      - cctv-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_* ต้องส่งเป็น build args เพราะ Vite ฝังค่าลงใน bundle ตอน build เท่านั้น
      # (ตั้งค่าตอน `environment:` ตอนรัน container จะไม่มีผลกับหน้าเว็บที่ build ไว้แล้ว)
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_MEDIA_URL: ${VITE_MEDIA_URL:-http://localhost:1984}
    container_name: srb-cctv-frontend
    restart: always
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:3000:3000"
    depends_on:
      - backend
    networks:
      - cctv-net

volumes:
  pgdata:

networks:
  cctv-net:
    driver: bridge
